  .card .sub { margin: 2px 0 0; color: var(--ink2); font-size: 13px; }

  .card button.toggle[aria-pressed="true"] { background: var(--wash); color: var(--ink); }
  .note { color: var(--muted); font-size: 12px; margin: 8px 0 0; }

  .chart { overflow-x: auto; }
  .chart svg { display: block; width: 100%; height: auto; min-width: 460px; }
  .chart svg.wide-min { min-width: 640px; }
  svg text { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--muted); }
  svg text.ink { fill: var(--ink2); }
  svg text.strong { fill: var(--ink); font-weight: 600; }

  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

  .hero .lbl { color: var(--ink2); }

  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }

  .tile .delta.bad { color: var(--bad); }

  th, td { padding: 7px 10px; text-align: left; border-bottom: 1px solid var(--grid); vertical-align: top; }

  footer { color: var(--muted); font-size: 12px; margin-top: 24px; }

<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const NS = "http://www.w3.org/2000/svg";

/* ---------- DOM helpers (text goes in via textContent only) ---------- */
function mk(ns, tag, attrs, kids) {
  const e = ns ? document.createElementNS(NS, tag) : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "on") for (const [ev, fn] of Object.entries(v)) e.addEventListener(ev, fn);
    else if (v !== null && v !== undefined) e.setAttribute(k, v);
  }
  for (const kid of kids || []) e.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  return e;
}
const h = (tag, attrs, ...kids) => mk(false, tag, attrs, kids);
const s = (tag, attrs, ...kids) => mk(true, tag, attrs, kids);

/* ---------- formatting ---------- */
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const monthLabel = ym => `${MONTHS[+ym.slice(5, 7) - 1]} ’${ym.slice(2, 4)}`;
const monthLong = ym => `${MONTHS[+ym.slice(5, 7) - 1]} ${ym.slice(0, 4)}`;
const gbp = (n, d = 1) => {
  const a = Math.abs(n), sg = n < 0 ? "-" : "";
  if (a >= 1e6) return `${sg}£${(a / 1e6).toFixed(d)}M`;
  if (a >= 1e3) return `${sg}£${(a / 1e3).toFixed(0)}K`;
  return `${sg}£${a.toFixed(0)}`;
};
const compact = n => n >= 1e6 ? `${+(n / 1e6).toFixed(1)}M` : n >= 1e3 ? `${+(n / 1e3).toFixed(1)}K` : `${n}`;
const int = n => Math.round(n).toLocaleString("en-GB");
const pct = (x, d = 0) => `${(x * 100).toFixed(d)}%`;

function niceMax(max, count = 4) {
  const raw = max / count, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(v => v >= raw);
  return { step, max: step * Math.ceil(max / step) };
}

/* ---------- theme ---------- */
const root = document.documentElement;
const darkMq = window.matchMedia("(prefers-color-scheme: dark)");
const isDark = () => root.dataset.theme ? root.dataset.theme === "dark" : darkMq.matches;
const RAMP_LIGHT = ["#cde2fb", "#9ec5f4", "#6da7ec", "#3987e5", "#256abf", "#184f95", "#0d366b"];
const RAMP_DARK  = ["#0d366b", "#104281", "#184f95", "#1c5cab", "#2a78d6", "#5598e7", "#86b6ef"];
function hex(c) { return [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)); }
function rampColor(t) {
  const ramp = isDark() ? RAMP_DARK : RAMP_LIGHT;
  const x = Math.min(1, Math.max(0, t)) * (ramp.length - 1), i = Math.min(ramp.length - 2, Math.floor(x));
  const a = hex(ramp[i]), b = hex(ramp[i + 1]), f = x - i;
  const rgb = a.map((v, j) => Math.round(v + (b[j] - v) * f));
  return { css: `rgb(${rgb})`, dark: (0.299 * rgb[0] + 0.587 * rgb[1] + 0.114 * rgb[2]) < 140 };
}
const rerenders = [];
const rerenderAll = () => rerenders.forEach(fn => fn());
(function themeToggle() {
  const btn = document.getElementById("theme");
  const modes = ["auto", "light", "dark"];
  let saved = "auto";
  try { saved = localStorage.getItem("retail-theme") || "auto"; } catch (e) {}
  const apply = m => {
    if (m === "auto") delete root.dataset.theme; else root.dataset.theme = m;
    btn.textContent = `Theme: ${m}`;
    try { localStorage.setItem("retail-theme", m); } catch (e) {}
  };
  apply(saved);
  btn.addEventListener("click", () => {
    const cur = root.dataset.theme || "auto";
    apply(modes[(modes.indexOf(cur) + 1) % 3]);
    rerenderAll();
  });
  darkMq.addEventListener("change", rerenderAll);
})();

/* ---------- tooltip ---------- */
const tip = document.getElementById("tip");
function showTip(evt, title, rows) {
  tip.replaceChildren();
  tip.append(h("div", { class: "tt" }, title));
  for (const r of rows) {
    const key = h("span", { class: "k" });
    if (r.color) key.append(h("b", { style: `background:${r.color}` }));
    key.append(r.label);
    tip.append(h("div", { class: "row" }, key, h("span", { class: "v" }, r.value)));
  }
  tip.style.display = "block";
  const pad = 14, w = tip.offsetWidth, hh = tip.offsetHeight;
  let x = evt.clientX + pad, y = evt.clientY + pad;
  if (x + w > innerWidth - 8) x = evt.clientX - w - pad;
  if (y + hh > innerHeight - 8) y = evt.clientY - hh - pad;
  tip.style.left = `${Math.max(8, x)}px`;
  tip.style.top = `${Math.max(8, y)}px`;
}
const hideTip = () => { tip.style.display = "none"; };

/* ---------- cards with a table view ---------- */
function buildTable({ cols, rows }) {
  const head = h("tr", {}, ...cols.map(c => h("th", { class: c.num ? "num" : "" }, c.label)));
  const body = rows.map(r => h("tr", {}, ...cols.map((c, i) => h("td", { class: c.num ? "num" : "" }, r[i]))));
  return h("div", { class: "tablewrap" }, h("table", {}, h("thead", {}, head), h("tbody", {}, ...body)));
}
function card(parent, { title, sub, wide, draw, table, tableOnly, legend, note }) {
  const body = h("div", { class: "chart" });
  const toggle = table && !tableOnly ? h("button", { type: "button", class: "toggle", "aria-pressed": "false" }, "Table view") : null;
  const sec = h("section", { class: "card" + (wide ? " wide" : "") },
    h("header", {}, h("div", {}, h("h3", {}, title), sub ? h("p", { class: "sub" }, sub) : ""), toggle || ""));
  if (legend) {
    sec.append(h("div", { class: "legend" }, ...legend.map(l => h("span", {}, h("i", { style: `background:${l.color}` }), l.label))));
  }
  sec.append(body);
  if (note) sec.append(h("p", { class: "note" }, note));
  let asTable = !!tableOnly;
  const render = () => {
    hideTip();
    body.replaceChildren();
    if (asTable) body.append(buildTable(table())); else draw(body);
  };
  if (toggle) toggle.addEventListener("click", () => {
    asTable = !asTable;
    toggle.setAttribute("aria-pressed", String(asTable));
    toggle.textContent = asTable ? "Chart view" : "Table view";
    render();
  });
  parent.append(sec);
  rerenders.push(render);
  render();
}

/* ---------- chart primitives ---------- */
const C = { s1: "var(--s1)", s2: "var(--s2)", s3: "var(--s3)" };

function topRounded(x, y, w, hgt, r) {
  r = Math.min(r, w / 2, hgt);
  return `M${x},${y + hgt}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + hgt}Z`;
}
function rightRounded(x, y, w, hgt, r) {
  r = Math.min(r, hgt / 2, w);
  return `M${x},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + hgt - r}Q${x + w},${y + hgt} ${x + w - r},${y + hgt}H${x}Z`;
}

/* Columns: single or stacked series over categories. */
function columns(host, o) {
  const W = o.width || 760, H = o.height || 280, m = { l: 48, r: 12, t: 18, b: 30 };
  const pw = W - m.l - m.r, ph = H - m.t - m.b, n = o.cats.length;
  const totals = o.cats.map((_, i) => o.series.reduce((a, se) => a + (se.vals[i] || 0), 0));
  const top = o.yMax ? { step: o.yStep, max: o.yMax } : niceMax(Math.max(...totals));
  const ys = v => m.t + ph - (v / top.max) * ph;
  const band = pw / n, bw = Math.min(24, band * 0.7);
  const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": o.aria, class: o.cls || "" });
  for (let v = 0; v <= top.max + 1e-9; v += top.step) {
    svg.append(s("line", { x1: m.l, x2: W - m.r, y1: ys(v), y2: ys(v), style: `stroke:${v === 0 ? "var(--axis)" : "var(--grid)"};stroke-width:1` }));
    svg.append(s("text", { x: m.l - 8, y: ys(v) + 4, "text-anchor": "end" }, (o.yFmt || compact)(v)));
  }
  const every = Math.ceil(n / (o.maxLabels || 9));
  o.cats.forEach((c, i) => {
    if (i % every === 0 || i === n - 1 && n % every === 1) svg.append(s("text", { x: m.l + band * (i + 0.5), y: H - 10, "text-anchor": "middle" }, o.catLabel ? o.catLabel(c) : c));
  });
  o.cats.forEach((c, i) => {
    const cx = m.l + band * (i + 0.5), x = cx - bw / 2;
    const wash = s("rect", { x: m.l + band * i, y: m.t, width: band, height: ph, style: "fill:transparent" });
    svg.append(wash);
    let cum = 0;
    const live = o.series.filter(se => (se.vals[i] || 0) > 0);
    live.forEach((se, j) => {
      const y1 = ys(cum + se.vals[i]), y0 = ys(cum);
      const yTop = j === live.length - 1 ? y1 : y1 + 1, yBot = j === 0 ? y0 : y0 - 1;
      const hgt = Math.max(0, yBot - yTop);
      if (j === live.length - 1) svg.append(s("path", { d: topRounded(x, yTop, bw, hgt, 4), style: `fill:${se.color}` }));
      else svg.append(s("rect", { x, y: yTop, width: bw, height: hgt, style: `fill:${se.color}` }));
      cum += se.vals[i];
    });
    if (o.valueLabel && totals[i] > 0) svg.append(s("text", { x: cx, y: ys(totals[i]) - 6, "text-anchor": "middle", class: "ink" }, o.valueLabel(totals[i], i)));
    const rows = o.series.map(se => ({ color: se.color, label: se.name, value: (o.tipFmt || o.yFmt || int)(se.vals[i] || 0) }));
    if (o.series.length > 1) rows.push({ label: "Total", value: (o.tipFmt || o.yFmt || int)(totals[i]) });
    const extra = o.tipExtra ? o.tipExtra(i) : [];
    const on = {
      pointermove: e => { wash.style.fill = "var(--wash)"; showTip(e, o.tipTitle ? o.tipTitle(c, i) : String(c), rows.concat(extra)); },
      pointerleave: () => { wash.style.fill = "transparent"; hideTip(); },
    };
    for (const [ev, fn] of Object.entries(on)) wash.addEventListener(ev, fn);
  });
  host.append(svg);
}

/* Horizontal grouped bars. */
function hbars(host, o) {
  const W = 760, rowH = o.rowH || 38, m = { l: o.left || 130, r: 54, t: 6, b: 24 };
  const H = m.t + m.b + rowH * o.cats.length, pw = W - m.l - m.r;
  const top = niceMax(Math.max(...o.series.flatMap(se => se.vals)), 4);
  const xs = v => m.l + (v / top.max) * pw, th = 10, gap = 2;
  const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": o.aria });
  for (let v = 0; v <= top.max + 1e-9; v += top.step) {
    svg.append(s("line", { x1: xs(v), x2: xs(v), y1: m.t, y2: H - m.b, style: `stroke:${v === 0 ? "var(--axis)" : "var(--grid)"};stroke-width:1` }));
    svg.append(s("text", { x: xs(v), y: H - 8, "text-anchor": "middle" }, o.xFmt(v)));
  }
  o.cats.forEach((c, i) => {
    const y = m.t + rowH * i, groupH = th * o.series.length + gap * (o.series.length - 1), y0 = y + (rowH - groupH) / 2;
    svg.append(s("text", { x: m.l - 10, y: y + rowH / 2 + 4, "text-anchor": "end", class: "ink" }, c));
    const wash = s("rect", { x: 0, y, width: W, height: rowH, style: "fill:transparent" });
    svg.append(wash);
    o.series.forEach((se, j) => {
      const by = y0 + j * (th + gap), w = Math.max(1, xs(se.vals[i]) - m.l);
      svg.append(s("path", { d: rightRounded(m.l, by, w, th, 4), style: `fill:${se.color}` }));
      if (o.labelSeries === j) svg.append(s("text", { x: m.l + w + 6, y: by + th - 1, class: "ink" }, o.xFmt(se.vals[i])));
    });
    const rows = o.series.map(se => ({ color: se.color, label: se.name, value: o.xFmt(se.vals[i]) })).concat(o.tipExtra ? o.tipExtra(i) : []);
    wash.addEventListener("pointermove", e => { wash.style.fill = "var(--wash)"; showTip(e, c, rows); });
    wash.addEventListener("pointerleave", () => { wash.style.fill = "transparent"; hideTip(); });
  });
  host.append(svg);
}

/* Cohort heatmap. */
function heatmap(host) {
  const rowsData = D.cohorts, K = 12;
  const W = 760, m = { l: 112, r: 12, t: 24, b: 8 }, cell = (W - m.l - m.r) / K, rh = 20;
  const H = m.t + m.b + rh * rowsData.length;
  const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", class: "wide-min", "aria-label": "Cohort retention heatmap" });
  for (let k = 1; k <= K; k++) svg.append(s("text", { x: m.l + cell * (k - 0.5), y: 15, "text-anchor": "middle" }, k));
  rowsData.forEach((row, i) => {
    const y = m.t + rh * i;
    svg.append(s("text", { x: m.l - 8, y: y + 14, "text-anchor": "end", class: "ink" }, `${monthLabel(row.c)} · n=${int(row.n)}`));
    for (let k = 1; k <= K; k++) {
      const v = row.r[k];
      if (v === null || v === undefined) continue;
      const col = rampColor(v / 0.5);
      const x = m.l + cell * (k - 1);
      const rect = s("rect", { x: x + 1, y: y + 1, width: cell - 2, height: rh - 2, rx: 2, style: `fill:${col.css}` });
      svg.append(rect);
      svg.append(s("text", { x: x + cell / 2, y: y + 14, "text-anchor": "middle", style: `fill:${col.dark ? "#fff" : "#0b0b0b"};pointer-events:none` }, Math.round(v * 100)));
      rect.addEventListener("pointermove", e => {
        rect.style.stroke = "var(--ink)"; rect.style.strokeWidth = "1.5";
        showTip(e, `${monthLong(row.c)} cohort, month ${k}`, [
          { label: "Active customers", value: `${int(v * row.n)} of ${int(row.n)}` },
          { label: "Retention", value: pct(v, 1) }]);
      });
      rect.addEventListener("pointerleave", () => { rect.style.stroke = "none"; hideTip(); });
    }
  });
  host.append(svg);
}

/* Pareto line. */
function pareto(host) {
  const W = 560, H = 320, m = { l: 48, r: 24, t: 16, b: 38 }, pw = W - m.l - m.r, ph = H - m.t - m.b;
  const xs = v => m.l + (v / 100) * pw, ys = v => m.t + ph - (v / 100) * ph;
  const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Revenue concentration curve" });
  for (let v = 0; v <= 100; v += 25) {
    svg.append(s("line", { x1: m.l, x2: W - m.r, y1: ys(v), y2: ys(v), style: `stroke:${v === 0 ? "var(--axis)" : "var(--grid)"};stroke-width:1` }));
    svg.append(s("text", { x: m.l - 8, y: ys(v) + 4, "text-anchor": "end" }, `${v}%`));
    svg.append(s("text", { x: xs(v), y: H - 22, "text-anchor": "middle" }, `${v}%`));
  }
  svg.append(s("text", { x: m.l + pw / 2, y: H - 6, "text-anchor": "middle" }, "Share of customers, ranked by sales"));
  svg.append(s("line", { x1: xs(0), y1: ys(0), x2: xs(100), y2: ys(100), style: "stroke:var(--muted);stroke-width:1" }));
  svg.append(s("text", { x: xs(58), y: ys(53) + 14, "text-anchor": "middle", transform: `rotate(-${Math.atan(ph / pw) * 180 / Math.PI} ${xs(58)} ${ys(53) + 14})` }, "equal share"));
  const pts = D.pareto.map(([x, y]) => `${xs(x)},${ys(y)}`);
  svg.append(s("path", { d: `M${xs(0)},${ys(0)}L${pts.join("L")}L${xs(100)},${ys(0)}Z`, style: "fill:var(--s1);opacity:0.10" }));
  svg.append(s("polyline", { points: pts.join(" "), style: "fill:none;stroke:var(--s1);stroke-width:2;stroke-linejoin:round;stroke-linecap:round" }));
  const p10 = D.pareto.find(p => p[0] === 10);
  svg.append(s("circle", { cx: xs(10), cy: ys(p10[1]), r: 5, style: "fill:var(--s1);stroke:var(--surface);stroke-width:2" }));
  svg.append(s("text", { x: xs(10) + 12, y: ys(p10[1]) + 16, class: "strong" }, `Top 10% = ${Math.round(p10[1])}% of sales`));
  const cross = s("line", { y1: m.t, y2: m.t + ph, style: "stroke:var(--muted);stroke-width:1;display:none" });
  const dot = s("circle", { r: 5, style: "fill:var(--s1);stroke:var(--surface);stroke-width:2;display:none" });
  svg.append(cross, dot);
  const hit = s("rect", { x: m.l, y: m.t, width: pw, height: ph, style: "fill:transparent" });
  hit.addEventListener("pointermove", e => {
    const box = svg.getBoundingClientRect(), px = (e.clientX - box.left) * (W / box.width);
    const x = Math.max(0, Math.min(100, Math.round((px - m.l) / pw * 100))), y = D.pareto[x][1];
    cross.style.display = dot.style.display = "block";
    cross.setAttribute("x1", xs(x)); cross.setAttribute("x2", xs(x));
    dot.setAttribute("cx", xs(x)); dot.setAttribute("cy", ys(y));
    showTip(e, `Top ${x}% of customers`, [{ color: C.s1, label: "Share of sales", value: `${y.toFixed(1)}%` }]);
  });
  hit.addEventListener("pointerleave", () => { cross.style.display = dot.style.display = "none"; hideTip(); });
  svg.append(hit);
  host.append(svg);
}

/* ---------- views ---------- */
const K = D.kpis;
const monthsFull = D.monthly.filter(m => !m.partial);

function tile(label, val, delta, tone) {
  return h("div", { class: "tile" }, h("div", { class: "lbl" }, label), h("div", { class: "val" }, val),
    h("div", { class: "delta " + (tone || "") }, delta));
}

function viewOverview(p) {
  const top = h("div", { class: "grid" });

  top.append(hero);
  const tiles = h("div", { class: "tiles" },
    tile("Tracked customers", int(K.tracked_customers), "buyers with a customer ID"),
    tile("Repeat purchase rate", pct(K.repeat_rate), "placed 2+ orders"),
    tile("Sales growth", `${K.yoy >= 0 ? "+" : ""}${(K.yoy * 100).toFixed(1)}%`, "Jan–Nov 2011 vs 2010"),
    tile("New customers", pct(K.new_cust_change), "Jun–Nov 2011 vs 2010", "bad"));
  top.append(tiles);
  p.append(top);

  const g = h("div", { class: "grid" });
  card(g, {
    title: "Gross sales by month", sub: "GBP, cancellations excluded. December 2011 is partial (to 9 Dec) and left out.", wide: true,
    draw: b => columns(b, {
      cats: monthsFull.map(m => m.m), series: [{ name: "Gross sales", color: C.s1, vals: monthsFull.map(m => m.gross) }],
      yFmt: v => v >= 1e6 ? `£${+(v / 1e6).toFixed(1)}M` : v >= 1e3 ? `£${v / 1e3}K` : `£${v}`, tipFmt: v => gbp(v, 2), catLabel: monthLabel, tipTitle: monthLong, aria: "Monthly gross sales",
      tipExtra: i => [{ label: "Orders", value: int(monthsFull[i].orders) }, { label: "Avg order value", value: gbp(monthsFull[i].aov, 0) }],
    }),
    table: () => ({ cols: [{ label: "Month" }, { label: "Gross sales", num: 1 }, { label: "Cancelled", num: 1 }, { label: "Orders", num: 1 }, { label: "Customers", num: 1 }, { label: "Avg order value", num: 1 }],
      rows: D.monthly.map(m => [monthLong(m.m) + (m.partial ? " (partial)" : ""), gbp(m.gross, 2), gbp(m.cancelled, 2), int(m.orders), int(m.customers), gbp(m.aov, 0)]) }),
  });
  card(g, {
    title: "Active customers: returning vs new", sub: "Customers buying each month. The first month (Dec 2009) counts everyone as new because the data starts there.",
    legend: [{ color: C.s1, label: "Returning" }, { color: C.s2, label: "New" }],
    draw: b => columns(b, {
      cats: monthsFull.map(m => m.m), series: [{ name: "Returning", color: C.s1, vals: monthsFull.map(m => m.returning) }, { name: "New", color: C.s2, vals: monthsFull.map(m => m.new) }],
      width: 560, yFmt: compact, tipFmt: int, catLabel: monthLabel, tipTitle: monthLong, aria: "Active customers by month, new and returning",
    }),
    table: () => ({ cols: [{ label: "Month" }, { label: "Returning", num: 1 }, { label: "New", num: 1 }],
      rows: monthsFull.map(m => [monthLong(m.m), int(m.returning), int(m.new)]) }),
  });
  const find = h("section", { class: "card" }, h("header", {}, h("div", {}, h("h3", {}, "Key insights"))),
    h("ul", { class: "findings" },
      h("li", {}, `Sales are flat (${K.yoy >= 0 ? "+" : ""}${(K.yoy * 100).toFixed(1)}% on the same months a year earlier), but not because customers leave after one order: ${pct(K.repeat_rate)} reorder.`),
      h("li", {}, `New-customer acquisition fell ${Math.abs(Math.round(K.new_cust_change * 100))}% (Jun–Nov 2011 vs 2010). Cohort quality has been stable since mid-2010, so volume is the part to investigate.`),
      h("li", {}, `Revenue is concentrated: the top 10% of customers bring ${pct(K.top10_share)} of sales, and RFM Champions (${pct(K.champ_cust_share)} of customers) bring ${pct(K.champ_rev_share)}.`),
      h("li", {}, `Silence is the churn signal, not slowing gaps or cancellations. A 90-day rule flags ${int(K.flagged_customers)} customers worth ${gbp(K.flagged_rev)} in trailing sales.`),
      h("li", {}, `Leaks: cancellations are ${pct(K.cancel_rate, 1)} of gross sales; ${pct(K.guest_share)} of sales have no customer ID.`)));
  g.append(find);
  p.append(g);
}

function viewRetention(p) {
  const g = h("div", { class: "grid" });
  card(g, {
    title: "Cohort retention", wide: true,
    sub: "Share of each monthly cohort that ordered again k months after their first purchase. Colour intensity rises with retention.",
    draw: heatmap,
    table: () => ({ cols: [{ label: "Cohort" }, { label: "Customers", num: 1 }].concat([...Array(12)].map((_, i) => ({ label: `M${i + 1}`, num: 1 }))),
      rows: D.cohorts.map(r => [monthLong(r.c), int(r.n)].concat(r.r.slice(1, 13).map(v => v == null ? "" : pct(v)))) }),
    note: "Monthly activity is seasonal: a September–November cohort looks stronger at month 12 because customers return for the next peak. The Dec 2009 cohort is overstated (it includes customers who bought before the data starts).",
  });
  card(g, {
    title: "90-day repeat rate", sub: "Share of new customers placing a second order within 90 days of their first.",
    draw: b => columns(b, {
      cats: D.repeat90.map(r => r.g), series: [{ name: "Repeat within 90 days", color: C.s1, vals: D.repeat90.map(r => r.rate * 100) }],
      width: 560, yMax: 80, yStep: 20, yFmt: v => `${v}%`, tipFmt: v => `${v.toFixed(1)}%`, valueLabel: v => `${Math.round(v)}%`, tipTitle: c => `Acquired ${c}`,
      tipExtra: i => [{ label: "Customers", value: int(D.repeat90[i].n) }], aria: "90-day repeat rate by acquisition period", maxLabels: 6,
    }),
    table: () => ({ cols: [{ label: "Acquired" }, { label: "Customers", num: 1 }, { label: "Repeat in 90 days", num: 1 }], rows: D.repeat90.map(r => [r.g, int(r.n), pct(r.rate, 1)]) }),

  card(g, {

    legend: [{ color: C.s1, label: "UK" }, { color: C.s2, label: "Non-UK" }],
    draw: b => columns(b, {
      cats: D.newCust.map(r => r.m), series: [{ name: "UK", color: C.s1, vals: D.newCust.map(r => r.uk) }, { name: "Non-UK", color: C.s2, vals: D.newCust.map(r => r.non) }],
      width: 560, yFmt: compact, tipFmt: int, catLabel: monthLabel, tipTitle: monthLong, aria: "New customers per month, UK and non-UK",
    }),
    table: () => ({ cols: [{ label: "Month" }, { label: "UK", num: 1 }, { label: "Non-UK", num: 1 }], rows: D.newCust.map(r => [monthLong(r.m), int(r.uk), int(r.non)]) }),
    note: "Dec 2009 (955 customers, including people who had bought before the data starts) and the partial Dec 2011 are left out.",
  });
  p.append(g);
}

function viewSegments(p) {
  const segs = D.segments;
  const g = h("div", { class: "grid" });
  card(g, {
    title: "RFM segments: customers vs revenue", wide: true,
    sub: "Customers scored 1–5 on recency, frequency and monetary value, then grouped. Sorted by revenue.",
    legend: [{ color: C.s1, label: "Share of customers" }, { color: C.s2, label: "Share of net revenue" }],
    draw: b => hbars(b, {
      cats: segs.map(x => x.segment), aria: "Share of customers and revenue by RFM segment", xFmt: v => `${Math.round(v * 100)}%`, labelSeries: 1,
      series: [{ name: "Share of customers", color: C.s1, vals: segs.map(x => x.customer_share) }, { name: "Share of net revenue", color: C.s2, vals: segs.map(x => x.revenue_share) }],
      tipExtra: i => [{ label: "Customers", value: int(segs[i].customers) }, { label: "Net revenue", value: gbp(segs[i].revenue, 2) }, { label: "Avg days since last order", value: int(segs[i].avg_recency_days) }, { label: "Avg orders", value: segs[i].avg_orders.toFixed(1) }],
    }),
    table: () => ({ cols: [{ label: "Segment" }, { label: "Customers", num: 1 }, { label: "% customers", num: 1 }, { label: "Net revenue", num: 1 }, { label: "% revenue", num: 1 }, { label: "Avg days since order", num: 1 }, { label: "Avg orders", num: 1 }, { label: "Avg net sales", num: 1 }],
      rows: segs.map(x => [x.segment, int(x.customers), pct(x.customer_share, 1), gbp(x.revenue, 2), pct(x.revenue_share, 1), int(x.avg_recency_days), x.avg_orders.toFixed(1), gbp(x.avg_net_sales, 0)]) }),
    note: "Revenue is lifetime net sales (sales minus cancellations) within the two-year window, not a forecast.",
  });
  card(g, {
    title: "Revenue concentration", sub: "Cumulative share of tracked sales earned by the top share of customers.",
    draw: pareto,
    table: () => ({ cols: [{ label: "Top share of customers" }, { label: "Share of sales", num: 1 }], rows: [1, 5, 10, 20, 50].map(x => [`${x}%`, `${D.pareto[x][1].toFixed(1)}%`]) }),
  });
  const slipping = segs.filter(x => x.slipping);
  const sum = (a, f) => a.reduce((t, x) => t + f(x), 0);
  g.append(h("section", { class: "card" }, h("header", {}, h("div", {}, h("h3", {}, "Who is slipping away?"),
    h("p", { class: "sub" }, "Need Attention, About to Sleep, At Risk and Can't Lose Them"))),
    h("div", { class: "tiles" },
      tile("Customers", int(sum(slipping, x => x.customers)), pct(sum(slipping, x => x.customer_share)) + " of scored customers"),
      tile("Net revenue to date", gbp(sum(slipping, x => x.revenue)), pct(sum(slipping, x => x.revenue_share)) + " of total"),
      tile("Silent 142+ days", int(K.quiet_vips), `top-value customers, ${gbp(K.quiet_vips_rev, 0)} lifetime`)),
    h("p", { class: "note" }, "142 days is twice the 71-day upper end of a typical reorder gap. Many At Risk customers have been silent 6–13 months and may already be lost.")));
  p.append(g);
}

function viewChurn(p) {
  p.append(h("div", { class: "tiles", style: "margin-bottom:16px" },
    tile("Flagged customers", int(K.flagged_customers), "silent 90+ days, active in last 12 months"),
    tile("Trailing 12m sales", gbp(K.flagged_rev), "of flagged customers"),
    tile("Expected loss", gbp(K.expected_loss), `at ${pct(K.rule_precision)} rule precision`, "bad"),
    tile("Top tier", `${int(K.top_tier_customers)} customers`, `${gbp(K.top_tier_rev, 0)} trailing sales`)));
  const g = h("div", { class: "grid" });
  card(g, {
    title: "Churn rises with silence", sub: "Share of customers with no purchase in the next 161 days, by days since last purchase (back-test at 30 Jun 2011).",
    draw: b => columns(b, {
      cats: D.churnBands.map(r => r.band), series: [{ name: "Churned", color: C.s2, vals: D.churnBands.map(r => r.rate * 100) }],
      width: 560, yMax: 80, yStep: 20, yFmt: v => `${v}%`, tipFmt: v => `${v.toFixed(1)}%`, valueLabel: v => `${Math.round(v)}%`, tipTitle: c => `${c} days silent`,
      tipExtra: i => [{ label: "Customers", value: int(D.churnBands[i].n) }], aria: "Churn rate by days since last purchase", maxLabels: 6,
    }),
    table: () => ({ cols: [{ label: "Days silent" }, { label: "Customers", num: 1 }, { label: "Churn rate", num: 1 }], rows: D.churnBands.map(r => [r.band, int(r.n), pct(r.rate, 1)]) }),
  });
  card(g, {
    title: "Early-warning rules, back-tested", tableOnly: true,
    sub: "Precision = flagged customers who truly churned. Recall = churners flagged. Revenue = churners' trailing sales flagged.",
    table: () => ({ cols: [{ label: "Rule" }, { label: "Flagged", num: 1 }, { label: "Precision", num: 1 }, { label: "Recall", num: 1 }, { label: "Revenue", num: 1 }],
      rows: D.rules.map(r => [r.rule, int(r.flagged), pct(r.precision), pct(r.recall), pct(r.revenue_captured)]) }),
    note: "Base churn is 44% for all active customers and 28% for customers with 3+ order days, so the relative-gap rules are measured on a different group.",
  });
  card(g, {
    title: "Top-value customers to contact first", wide: true, tableOnly: true,
    sub: "Highest trailing 12-month net sales among customers silent for more than 90 days (as of 10 Dec 2011). “Early flag” = silent beyond 1.5x their own average gap.",
    table: () => ({ cols: [{ label: "Customer" }, { label: "Days silent", num: 1 }, { label: "Own avg gap (days)", num: 1 }, { label: "Order days", num: 1 }, { label: "Trailing 12m sales", num: 1 }, { label: "Early flag" }],
      rows: D.topRisk.map(r => [`#${r.id}`, int(r.days), r.avg_gap == null ? "n/a" : r.avg_gap.toFixed(0), int(r.orders), gbp(r.trailing, 0), r.early ? "Yes" : "No"]) }),
  });
  p.append(g);
}

function viewActions(p) {
  const g = h("div", { class: "grid" });
  card(g, {
    title: "Recommendations, ranked by value for effort", wide: true, tableOnly: true,
    sub: "Annual revenue impact under low / mid / high scenarios. The measured base comes from the data; the scenario percentages are assumptions to replace with test results.",
    table: () => ({ cols: [{ label: "#", num: 1 }, { label: "Action" }, { label: "Evidence" }, { label: "Measured base", num: 1 }, { label: "Low", num: 1 }, { label: "Mid", num: 1 }, { label: "High", num: 1 }, { label: "Effort" }],
      rows: D.recs.map(r => [r.rank, r.recommendation, r.evidence, gbp(r.base, 0), gbp(r.low, 0), gbp(r.mid, 0), gbp(r.high, 0), r.effort]) }),
    note: "Not covered by this data: why acquisition fell (no channel data), what a win-back campaign will really recover (run a holdout test), and whether anything would change behaviour (product mix adds little to churn prediction, notebook 11).",
  });
  p.append(g);
}

/* ---------- shell ---------- */
document.getElementById("lede").textContent = D.meta.lede;
document.getElementById("foot").textContent = D.meta.footer;
const TABS = [["Overview", viewOverview], ["Retention", viewRetention], ["Segments", viewSegments], ["Churn risk", viewChurn], ["Actions", viewActions]];
const tabsEl = document.getElementById("tabs"), panels = document.getElementById("panels");
TABS.forEach(([name, fn], i) => {
  const panel = h("section", { class: "panel", id: `panel-${i}`, role: "tabpanel", "aria-labelledby": `tab-${i}` });
  fn(panel);
  panels.append(panel);
  const btn = h("button", { type: "button", role: "tab", id: `tab-${i}`, "aria-controls": `panel-${i}` }, name);
  btn.addEventListener("click", () => select(i));
  tabsEl.append(btn);
});
function select(i) {
  hideTip();
  [...tabsEl.children].forEach((b, j) => b.setAttribute("aria-selected", String(i === j)));
  [...panels.children].forEach((p, j) => { p.hidden = i !== j; });
  try { history.replaceState(null, "", `#${TABS[i][0].toLowerCase().replace(" ", "-")}`); } catch (e) {}
}
const start = TABS.findIndex(t => `#${t[0].toLowerCase().replace(" ", "-")}` === location.hash);
select(start < 0 ? 0 : start);
</script>
